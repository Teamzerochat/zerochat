<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- FRAME -->
  <rect x="16" y="16" width="648" height="428" rx="12" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
  <text x="30" y="34" font-size="11" font-weight="600" fill="#888780">
    PHASE 2 — ENCRYPTION AND TRANSPORT
  </text>

  <!-- USER -->
  <rect x="32" y="52" width="120" height="44" rx="8" fill="#27500a" stroke="#97c459"/>
  <text x="92" y="76" text-anchor="middle" fill="#c0dd97">User A</text>

  <!-- KEYS -->
  <rect x="210" y="52" width="200" height="56" rx="8" fill="#791f1f" stroke="#f09595" stroke-dasharray="5 3"/>
  <text x="310" y="72" text-anchor="middle" fill="#f7c1c1">Volatile session keys</text>
  <text x="310" y="92" text-anchor="middle" fill="#f09595" font-size="12">ephemeral — RAM only</text>

  <!-- COVER -->
  <rect x="444" y="52" width="204" height="56" rx="8" fill="#633806" stroke="#ef9f27"/>
  <text x="546" y="72" text-anchor="middle" fill="#fac775">Cover traffic gen.</text>
  <text x="546" y="92" text-anchor="middle" fill="#ef9f27" font-size="12">continuous dummy frames</text>

  <!-- USER → ENC -->
  <line x1="92" y1="96" x2="92" y2="180" stroke="#444" stroke-width="1.5"/>
  <line x1="92" y1="180" x2="200" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="140" y="135" font-size="11" fill="#5F5E5A" text-anchor="middle">message</text>

  <!-- KEYS → ENC -->
  <path d="M 310 108 L 310 150 L 280 150 L 280 160" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="340" y="140" font-size="11" fill="#888780" text-anchor="middle">key usage</text>

  <!-- ENCRYPTION -->
  <rect x="200" y="160" width="160" height="56" rx="8" fill="#085041" stroke="#5dcaA5"/>
  <text x="280" y="180" text-anchor="middle" fill="#9fe1cb">Encryption</text>
  <text x="280" y="200" text-anchor="middle" fill="#5dcaA5" font-size="12">AES-256-GCM</text>

  <!-- ENC → PREP -->
  <line x1="280" y1="216" x2="280" y2="268" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="327" y="245" font-size="11" fill="#5F5E5A" text-anchor="middle">encrypted payload</text>

  <!-- COVER → PREP -->
  <line x1="546" y1="108" x2="546" y2="240" stroke="#444" stroke-width="1.5"/>
  <line x1="546" y1="240" x2="480" y2="240" stroke="#444" stroke-width="1.5"/>
  <line x1="480" y1="240" x2="480" y2="268" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="560" y="185" font-size="11" fill="#5F5E5A">cover traffic</text>

  <!-- MESSAGE PREP -->
  <rect x="32" y="268" width="616" height="56" rx="8" fill="#085041" stroke="#5dcaA5"/>
  <text x="340" y="288" text-anchor="middle" fill="#9fe1cb">Message preparation</text>
  <text x="340" y="308" text-anchor="middle" fill="#5dcaA5" font-size="12">
    padding + framing — real and cover traffic indistinguishable
  </text>

  <!-- PREP → TRANSPORT -->
  <line x1="340" y1="324" x2="340" y2="368" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="380" y="350" font-size="11" fill="#5F5E5A" text-anchor="middle">framed payload</text>

  <!-- TRANSPORT -->
  <rect x="220" y="368" width="240" height="56" rx="8" fill="#085041" stroke="#5dcaA5"/>
  <text x="340" y="388" text-anchor="middle" fill="#9fe1cb">Transport routing</text>
  <text x="340" y="408" text-anchor="middle" fill="#5dcaA5" font-size="12">via Nym or I2P</text>

  <!-- NYM -->
  <rect x="32" y="368" width="146" height="56" rx="8" fill="#3c3489" stroke="#afa9ec"/>
  <text x="105" y="388" text-anchor="middle" fill="#cecbf6">Nym mixnet</text>
  <text x="105" y="408" text-anchor="middle" fill="#afa9ec" font-size="12">multi-hop anonymized</text>

  <!-- I2P -->
  <rect x="502" y="368" width="146" height="56" rx="8" fill="#3c3489" stroke="#afa9ec"/>
  <text x="575" y="388" text-anchor="middle" fill="#cecbf6">I2P network</text>
  <text x="575" y="408" text-anchor="middle" fill="#afa9ec" font-size="12">garlic-routed tunnels</text>

  <!-- ARROWS -->
  <line x1="220" y1="396" x2="178" y2="396" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="460" y1="396" x2="502" y2="396" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

</svg>