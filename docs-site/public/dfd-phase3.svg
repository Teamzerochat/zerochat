<svg width="100%" viewBox="0 0 720 530" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ZeroChat phase 3 — receive and decryption</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
<!--FRAME-->
  <rect x="16" y="16" width="688" height="480" rx="12" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
  <text x="30" y="34" font-size="11" font-weight="600" fill="#888780">
    PHASE 3 — RECEIVE AND DECRYPTION (CLIENT B)
  </text>
<!--NETWORK-->
  <rect x="32" y="52" width="180" height="56" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
  <text x="122" y="73" text-anchor="middle" fill="rgb(206,203,246)">Nym mixnet</text>
  <text x="122" y="93" text-anchor="middle" font-size="12" fill="rgb(175,169,236)">ciphertext arrives</text>
  <rect x="508" y="52" width="176" height="56" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
  <text x="596" y="73" text-anchor="middle" fill="rgb(206,203,246)">I2P network</text>
  <text x="596" y="93" text-anchor="middle" font-size="12" fill="rgb(175,169,236)">ciphertext arrives</text>
<!--VERIFICATION-->
  <rect x="218" y="130" width="284" height="56" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="360" y="151" text-anchor="middle" fill="rgb(159,225,203)">Message verification</text>
  <text x="360" y="171" text-anchor="middle" font-size="12" fill="rgb(93,202,165)">
    authenticity + integrity
  </text>
<!--FIXED ARROWS-->
  <polyline points="122,108 122,158 218,158" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <polyline points="596,108 596,158 502,158" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<!--DECRYPTION-->
  <rect x="260" y="216" width="200" height="56" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="360" y="237" text-anchor="middle" fill="rgb(159,225,203)">Decryption</text>
  <text x="360" y="257" text-anchor="middle" font-size="12" fill="rgb(93,202,165)">
    AES-256-GCM
  </text>
  <line x1="360" y1="186" x2="360" y2="216" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="368" y="204" font-size="11" fill="#5F5E5A">verified msg</text>
<!--KEYS-->
  <rect x="32" y="300" width="178" height="56" rx="8" fill="rgb(121,31,31)" stroke="rgb(240,149,149)" stroke-dasharray="5 3"/>
  <text x="121" y="321" text-anchor="middle" fill="rgb(247,193,193)">
    Volatile session keys B
  </text>
  <text x="121" y="341" text-anchor="middle" font-size="12" fill="rgb(240,149,149)">
    ephemeral — RAM only
  </text>
  <rect x="222" y="300" width="210" height="56" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="327" y="321" text-anchor="middle" fill="rgb(159,225,203)">
    Key derivation B (HKDF)
  </text>
  <text x="327" y="341" text-anchor="middle" font-size="12" fill="rgb(93,202,165)">
    session keys to RAM
  </text>
  <rect x="444" y="300" width="240" height="56" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="564" y="321" text-anchor="middle" fill="rgb(159,225,203)">
    Handshake B (SPAKE2+)
  </text>
  <text x="564" y="341" text-anchor="middle" font-size="12" fill="rgb(93,202,165)">
    mirror of client A
  </text>
<!--ARROWS-->
  <line x1="444" y1="328" x2="432" y2="328" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="222" y1="328" x2="210" y2="328" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="564" y1="108" x2="564" y2="300" stroke="#444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <text x="558" y="215" font-size="11" fill="#5F5E5A" text-anchor="end">
    via rendezvous
  </text>
  <path d="M 210 328 L 220 300 L 260 272" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="282" y="298" font-size="11" fill="#888780" text-anchor="middle">
    ephemeral key read
  </text>
<!--USER-->
  <rect x="270" y="390" width="220" height="44" rx="8" fill="rgb(39,80,10)" stroke="rgb(151,196,89)"/>
  <text x="380" y="417" text-anchor="middle" fill="rgb(192,221,151)">
    User B
  </text>
  <path d="M 360 272 L 360 288 L 28 288 L 28 402 L 270 402" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="124" y="284" font-size="11" fill="#5F5E5A" text-anchor="middle">
    plaintext
  </text>
<!--LEGEND-->
  <rect x="32" y="458" width="10" height="10" rx="2" fill="rgb(159,225,203)" stroke="rgb(15,110,86)"/>
  <text x="48" y="467" font-size="11" fill="#5F5E5A">crypto / processing</text>
  <rect x="170" y="458" width="10" height="10" rx="2" fill="rgb(247,193,193)" stroke="rgb(163,45,45)" stroke-dasharray="4 2"/>
  <text x="186" y="467" font-size="11" fill="#5F5E5A">volatile key (RAM only)</text>
  <rect x="320" y="458" width="10" height="10" rx="2" fill="rgb(206,203,246)" stroke="rgb(83,74,183)"/>
  <text x="336" y="467" font-size="11" fill="#5F5E5A">network</text>
  <line x1="410" y1="463" x2="432" y2="463" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="438" y="467" font-size="11" fill="#5F5E5A">ephemeral read</text>
</svg>
