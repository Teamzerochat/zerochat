[package]
name = "nym-transport"
version = "0.1.0"
edition = "2021"
description = "NYM mixnet transport layer for ZeroChat"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "uniffi_nym_transport"

[dependencies]
# NYM SDK - connect to public mainnet (free)
nym-sdk = "1.20"
# NYM crypto - for DerivationMaterial (deterministic keypairs)
# NYM crypto - for DerivationMaterial (deterministic keypairs)
nym-crypto = "1.20"
# NYM client core - for Ephemeral storage and explicit key injection
# NYM client core - for Ephemeral storage and explicit key injection
nym-client-core = "1.20"
# NYM sphinx - for AckKey
nym-sphinx = "1.20"



# Async runtime
tokio = { version = "1.43", features = ["full"] }

# UniFFI for Kotlin bindings
uniffi = { version = "0.25", features = ["cli"] }

# Error handling
thiserror = "1.0"

# Cryptography for deterministic rendezvous address
sha2 = "0.10"
hkdf = "0.12"
bs58 = "0.5"

# SPAKE2+ for password-authenticated key exchange
spake2 = "0.4"

# State management
once_cell = "1.19"
rand = "0.8"

# Logging
log = "0.4"
hex = "0.4"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
uniffi = { version = "0.25", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
